
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Rajdhani:wght@500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  #gw{
    width:100%;min-height:580px;border-radius:16px;overflow:hidden;
    position:relative;background:#1a4a2e;
    font-family:'Rajdhani',sans-serif;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #c{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  #ui{position:absolute;top:0;left:0;right:0;z-index:10;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.35);}
  .hb{text-align:center;}
  .hl{font-size:9px;color:rgba(255,220,100,0.7);letter-spacing:1px;text-transform:uppercase;}
  .hv{font-size:22px;font-weight:700;color:#ffdc64;line-height:1.1;}
  #lives-wrap{display:flex;gap:4px;align-items:center;}
  .heart{width:18px;height:18px;background:#e84040;clip-path:polygon(50% 90%,5% 40%,15% 20%,30% 15%,50% 30%,70% 15%,85% 20%,95% 40%);}
  .heart.lost{background:#555;opacity:0.35;}
  .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(5,18,10,0.93);padding:20px;text-align:center;gap:14px;}
  .sc h1{font-family:'Noto Serif SC',serif;font-size:30px;color:#ffdc64;}
  .sc p{font-size:14px;color:rgba(255,255,255,0.82);line-height:1.6;max-width:320px;}
  .sc .sub{font-size:11px;color:rgba(255,220,100,0.6);letter-spacing:1px;}
  .sbtn{background:#cc5500;color:#fff;border:none;border-radius:10px;padding:13px 40px;font-size:18px;font-weight:700;font-family:'Rajdhani',sans-serif;cursor:pointer;letter-spacing:1px;display:block;}
  .sbtn2{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:10px;padding:8px 24px;font-size:13px;font-weight:600;font-family:'Rajdhani',sans-serif;cursor:pointer;}
  .pbox{background:rgba(255,200,80,0.1);border:1.5px solid rgba(255,200,80,0.45);border-radius:12px;padding:12px 24px;}
  .pbox .pe{font-size:36px;}
  .pbox .pt{font-size:18px;font-weight:700;color:#ffdc64;margin-top:4px;}
  .legend{display:flex;gap:14px;font-size:12px;color:rgba(255,255,255,0.75);align-items:center;flex-wrap:wrap;justify-content:center;}
  .leg-item{display:flex;align-items:center;gap:5px;}
  .hidden{display:none!important;}
  #combo-pop{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:15;font-size:16px;font-weight:700;color:#ffdc64;letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;}
  /* Phase indicator bar */
  #phase-bar{position:absolute;bottom:0;left:0;right:0;height:4px;z-index:11;background:rgba(0,0,0,0.3);}
  #phase-fill{height:100%;width:0%;transition:background 0.5s;border-radius:0 2px 2px 0;}
  #phase-label{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:12;font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,0.55);pointer-events:none;white-space:nowrap;}
  /* Timer arc */
  #timer-canvas{display:block;pointer-events:none;width:44px;height:44px;}
</style>

<h2 style="position:absolute;width:1px;height:1px;overflow:hidden">粽子接接接游戏</h2>

<div id="gw">
  <canvas id="c"></canvas>

  <div id="ui" class="hidden">
    <div class="hb"><div class="hl">得分</div><div class="hv" id="hv-score">0</div></div>
    <div class="hb"><div class="hl">时间</div><canvas id="timer-canvas" width="44" height="44"></canvas></div>
    <div class="hb"><div class="hl">连击</div><div class="hv" id="hv-combo">x1</div></div>
  </div>

  <div id="combo-pop"></div>
  <div id="phase-bar"><div id="phase-fill"></div></div>
  <div id="phase-label"></div>

  <div class="sc" id="sc-start">
    <div style="font-size:50px">🐉🟢🎋</div>
    <h1>粽子接接接</h1>
    <p>移动鼠标/触摸控制龙舟，接住掉落的粽子！<br>连续接住有连击加成，小心炸弹！</p>
    <div class="legend">
      <div class="leg-item"><span style="font-size:18px">🟢</span> 普通粽子 +2</div>
      <div class="leg-item"><span style="font-size:18px">⭐</span> 金粽子 +5</div>
      <div class="leg-item"><span style="font-size:18px">💣</span> 炸弹 -15分</div>
    </div>
    <p class="sub">得分直接兑换现金奖励，1分 = $1</p>
    <button class="sbtn" id="btn-start">开始游戏 ▶</button>
  </div>

  <div class="sc hidden" id="sc-over">
    <div style="font-size:46px" id="over-emoji">😓</div>
    <h1 id="over-title">游戏结束</h1>
    <div class="pbox hidden" id="prize-box">
      <div class="pe">🎁</div>
      <div class="pt" id="prize-text">免费抽奖一次！</div>
    </div>
    <p id="over-stat"></p>
    <button class="sbtn" id="btn-claim" style="display:none;margin:0 auto;">领取奖励 →</button>
    <button class="sbtn" id="btn-retry" style="margin:4px auto;">再玩一次 🔄</button>
  </div>
</div>

<script>
(function(){
  const gwEl = document.getElementById('gw');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const timerCanvas = document.getElementById('timer-canvas');
  const tctx = timerCanvas.getContext('2d');

  // ── Game constants ──────────────────────────────────────────────
  const GAME_DURATION = 30; // seconds
  const PHASES = [
    // [0-10s] Start already at final-rush pace, with bombs from the start
    { name:'热身阶段', nameEn:'WARM UP',    zongzi:0.75, gold:0.00, bomb:0.25, spawnBase:0.55, speedMult:1.65, color:'#44cc66' },
    // [10-20s] Faster
    { name:'高潮来袭', nameEn:'HEATING UP', zongzi:0.63, gold:0.12, bomb:0.25, spawnBase:0.42, speedMult:2.1,  color:'#ffdc64' },
    // [20-30s] Maximum overdrive
    { name:'终极冲刺', nameEn:'FINAL RUSH', zongzi:0.55, gold:0.17, bomb:0.28, spawnBase:0.28, speedMult:2.7,  color:'#ff6644' },
  ];

  let W=0, H=0;
  function resize(){
    W = gwEl.offsetWidth || 600;
    H = Math.max(gwEl.offsetHeight, 580);
    canvas.width = W;
    canvas.height = H;
    gwEl.style.minHeight = H + 'px';
  }

  let score=0, combo=1;
  let running=false, gameActive=false;
  let raf=null;
  let frameCount=0;
  let lastTimestamp=0, spawnAccum=0;
  let mouseX=300;
  let boat={x:300, y:500, w:110, h:48};
  let items=[], particles=[];
  let waveOff=0;
  let clouds=[];
  let gameStartTime=0;
  let elapsedSec=0;
  let currentPhaseIdx=0;

  function getPhase(){
    if(elapsedSec<10) return 0;
    if(elapsedSec<20) return 1;
    return 2;
  }

  function initClouds(){
    clouds=[];
    for(let i=0;i<5;i++) clouds.push({x:Math.random()*W, y:28+Math.random()*50, w:55+Math.random()*70, spd:0.2+Math.random()*0.25});
  }

  function updateUI(){
    document.getElementById('hv-score').textContent = score;
    document.getElementById('hv-combo').textContent = 'x'+combo;
  }

  function drawTimerArc(){
    const cx=22,cy=22,r=17;
    const timeLeft = Math.max(0, GAME_DURATION - elapsedSec);
    const frac = timeLeft / GAME_DURATION;
    const phase = PHASES[getPhase()];

    tctx.clearRect(0,0,44,44);
    // Track
    tctx.beginPath(); tctx.arc(cx,cy,r,0,Math.PI*2);
    tctx.strokeStyle='rgba(0,0,0,0.4)'; tctx.lineWidth=3.5; tctx.stroke();
    // Fill arc
    tctx.beginPath();
    tctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);
    tctx.strokeStyle=timeLeft<=5?'#ff4444':phase.color;
    tctx.lineWidth=3.5; tctx.lineCap='round'; tctx.stroke();
    // Time text
    tctx.fillStyle= timeLeft<=5?'#ff4444':'#ffdc64';
    tctx.font='bold 13px Rajdhani,sans-serif';
    tctx.textAlign='center'; tctx.textBaseline='middle';
    tctx.fillText(Math.ceil(timeLeft),cx,cy);
  }

  function updatePhaseBar(){
    const pct = Math.min(100,(elapsedSec/GAME_DURATION)*100);
    const ph = getPhase();
    const fill = document.getElementById('phase-fill');
    fill.style.width = pct+'%';
    fill.style.background = PHASES[ph].color;
    document.getElementById('phase-label').textContent = PHASES[ph].nameEn;
    document.getElementById('phase-label').style.color = PHASES[ph].color+'cc';
  }

  function spawnItem(){
    const ph = PHASES[getPhase()];
    const r = Math.random();
    let type;
    if(r < ph.bomb) type='bomb';
    else if(r < ph.bomb+ph.gold) type='gold';
    else type='zongzi';

    const cols=['#2d8a3e','#1e6b2e','#3aaa55','#4cbb6a'];
    // Speed in pixels per second (frame-rate independent)
    const baseSpeed = (220 + Math.random()*60) * ph.speedMult;
    items.push({
      x: 32+Math.random()*(W-64),
      y: -32,
      vy: baseSpeed,
      vx: (Math.random()-0.5)*30,
      type, color: cols[Math.floor(Math.random()*cols.length)],
      rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*3,
      size: type==='gold'?25:21, wobble:Math.random()*Math.PI*2
    });
  }

  function drawBg(){
    // Sky
    ctx.fillStyle='#192e50'; ctx.fillRect(0,0,W,H*0.38);
    // Moon
    ctx.beginPath(); ctx.arc(W-55,46,26,0,Math.PI*2);
    ctx.fillStyle='#fffbe6'; ctx.fill();
    ctx.beginPath(); ctx.arc(W-43,40,20,0,Math.PI*2);
    ctx.fillStyle='#192e50'; ctx.fill();
    // Stars
    [[80,22],[160,14],[250,30],[350,10],[430,25],[520,18],[60,55],[300,55]].forEach(([sx,sy])=>{
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.fillRect(sx,sy,1.5,1.5);
    });
    // Clouds — speed scaled to ~15px/sec
    clouds.forEach(cl=>{
      cl.x += cl.spd;
      if(cl.x>W+80) cl.x=-80;
      ctx.fillStyle='rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.ellipse(cl.x,cl.y,cl.w,16,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cl.x+18,cl.y-10,cl.w*0.65,12,0,0,Math.PI*2); ctx.fill();
    });
    // Water
    const wy=H*0.38;
    ctx.fillStyle='#0b4060'; ctx.fillRect(0,wy,W,H-wy);
    for(let i=0;i<5;i++){
      ctx.beginPath();
      const y2=wy+18+i*28;
      for(let x=0;x<=W;x+=5){
        const yy=y2+Math.sin((x+waveOff*(1+i*0.15))/38+i)*4;
        x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
      }
      ctx.strokeStyle=`rgba(255,255,255,${0.04+i*0.012})`; ctx.lineWidth=1; ctx.stroke();
    }
    // Bamboo
    for(let b=0;b<3;b++){
      const bx=(b+0.5)*(W/3)+(b%2===0?-15:15);
      for(let s=0;s<4;s++){
        const sy1=H*0.38-s*50, sy2=H*0.38-(s+0.78)*50;
        ctx.strokeStyle='#2d7a20'; ctx.lineWidth=9;
        ctx.beginPath(); ctx.moveTo(bx,sy1); ctx.lineTo(bx,sy2); ctx.stroke();
        ctx.strokeStyle='#1a5214'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(bx-5,sy1-8); ctx.lineTo(bx+5,sy1-8); ctx.stroke();
      }
      ctx.fillStyle='#3aaa55';
      ctx.beginPath(); ctx.ellipse(bx+18,H*0.38-190,18,6,-0.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx-16,H*0.38-150,16,5,0.4,0,Math.PI*2); ctx.fill();
    }
    // Lily pads
    for(let i=0;i<4;i++){
      const lx=(W/4)*(i+0.5)+Math.sin(frameCount/55+i)*12;
      const ly=H*0.44+i*6;
      ctx.beginPath(); ctx.ellipse(lx,ly,17,7,0,0,Math.PI*2);
      ctx.fillStyle='#1a6b2e'; ctx.fill();
      ctx.strokeStyle='#2d8a3e'; ctx.lineWidth=1; ctx.stroke();
    }
    // Lanterns
    for(let i=0;i<5;i++){
      const lx=(W/5)*i+W/10;
      const ly=45+Math.sin(frameCount/28+i)*3;
      ctx.fillStyle='#cc2200';
      ctx.beginPath(); ctx.ellipse(lx,ly,8,12,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,180,0,0.25)'; ctx.lineWidth=14;
      ctx.beginPath(); ctx.arc(lx,ly,10,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='#ffdc64'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(lx,ly-12); ctx.lineTo(lx,ly-20); ctx.stroke();
      ctx.fillStyle='#ffdc64'; ctx.fillRect(lx-4,ly-22,8,3);
    }
  }

  function drawBoat(x,y){
    const w=boat.w, h=boat.h;
    const bob=Math.sin(frameCount/18)*2;
    ctx.save(); ctx.translate(x, y+bob);
    // Hull
    ctx.beginPath();
    ctx.moveTo(-w/2+8, h*0.1); ctx.lineTo(w/2-8, h*0.1);
    ctx.lineTo(w/2+2, h*0.72); ctx.lineTo(-w/2-2, h*0.72); ctx.closePath();
    ctx.fillStyle='#cc2200'; ctx.fill();
    // Gold rim
    ctx.beginPath(); ctx.moveTo(-w/2+6,h*0.1); ctx.lineTo(w/2-6,h*0.1);
    ctx.strokeStyle='#ffdc64'; ctx.lineWidth=2.5; ctx.stroke();
    // Dragon head
    ctx.beginPath(); ctx.ellipse(w/2+9,h*0.28,12,9,0,0,Math.PI*2);
    ctx.fillStyle='#cc2200'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(w/2+18,h*0.2,5,3.5,0,0,Math.PI*2);
    ctx.fillStyle='#e84040'; ctx.fill();
    ctx.beginPath(); ctx.arc(w/2+19,h*0.19,1.5,0,Math.PI*2);
    ctx.fillStyle='#ffdc64'; ctx.fill();
    ctx.beginPath(); ctx.arc(w/2+19,h*0.19,0.8,0,Math.PI*2);
    ctx.fillStyle='#000'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(w/2+8,h*0.16); ctx.lineTo(w/2+13,h*0.04); ctx.lineTo(w/2+17,h*0.16);
    ctx.fillStyle='#ff9900'; ctx.fill();
    // Rowers
    for(let i=0;i<3;i++){
      const rx=-w/2+20+i*26;
      ctx.beginPath(); ctx.arc(rx,h*0.06,4.5,0,Math.PI*2);
      ctx.fillStyle='#ffcc99'; ctx.fill();
      ctx.fillStyle='#1a44a8'; ctx.fillRect(rx-4,h*0.12,8,9);
      const pa=Math.sin(frameCount/10+i*1.2)*0.5;
      ctx.save(); ctx.translate(rx,h*0.18); ctx.rotate(pa);
      ctx.strokeStyle='#8B4513'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(14,7); ctx.stroke();
      ctx.restore();
    }
    // Flag
    ctx.beginPath(); ctx.moveTo(-w/2+4,h*0.1); ctx.lineTo(-w/2+4,-h*0.32);
    ctx.strokeStyle='#8B4513'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w/2+4,-h*0.32); ctx.lineTo(-w/2+20,-h*0.16); ctx.lineTo(-w/2+4,0);
    ctx.fillStyle='#ffdc64'; ctx.fill();
    // Tail
    ctx.beginPath(); ctx.moveTo(-w/2-2,h*0.35); ctx.quadraticCurveTo(-w/2-14,h*0.2,-w/2-10,h*0.1);
    ctx.quadraticCurveTo(-w/2-4,h*0.28,-w/2-2,h*0.35);
    ctx.fillStyle='#cc2200'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-w/2-2,h*0.55); ctx.quadraticCurveTo(-w/2-14,h*0.7,-w/2-10,h*0.8);
    ctx.quadraticCurveTo(-w/2-4,h*0.65,-w/2-2,h*0.55);
    ctx.fillStyle='#cc2200'; ctx.fill();
    ctx.restore();
  }

  function drawItem(it){
    ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot);
    const s=it.size;
    if(it.type==='bomb'){
      ctx.beginPath(); ctx.arc(0,0,s*0.72,0,Math.PI*2);
      ctx.fillStyle='#222'; ctx.fill();
      ctx.strokeStyle='#555'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-s*0.72);
      ctx.bezierCurveTo(8,-s*1.1,13,-s*0.9,11,-s*0.6);
      ctx.strokeStyle='#996633'; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.arc(11,-s*0.6,3,0,Math.PI*2);
      ctx.fillStyle=frameCount%6<3?'#ffcc00':'#ff6600'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-5,-3); ctx.lineTo(-2,0); ctx.moveTo(-2,-3); ctx.lineTo(-5,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2,-3); ctx.lineTo(5,0); ctx.moveTo(5,-3); ctx.lineTo(2,0); ctx.stroke();
    } else if(it.type==='gold'){
      // Golden star dumpling with glow
      ctx.shadowColor='#ffdc64'; ctx.shadowBlur=12;
      for(let a=0;a<5;a++){
        ctx.save(); ctx.rotate(a*Math.PI*2/5);
        ctx.beginPath();
        ctx.moveTo(0,-s*1.1); ctx.lineTo(4,-s*0.42); ctx.lineTo(s*0.88,0);
        ctx.lineTo(4,s*0.42); ctx.lineTo(0,s*1.1); ctx.lineTo(-4,s*0.42);
        ctx.lineTo(-s*0.88,0); ctx.lineTo(-4,-s*0.42); ctx.closePath();
        ctx.fillStyle='#ffdc64'; ctx.fill(); ctx.restore();
      }
      ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(0,0,s*0.44,0,Math.PI*2);
      ctx.fillStyle='#fff8cc'; ctx.fill();
      ctx.fillStyle='#aa6600'; ctx.font=`bold ${Math.round(s*0.55)}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('粽',0,1);
    } else {
      const wb=Math.sin(it.wobble)*2;
      ctx.beginPath();
      ctx.moveTo(0+wb,-s); ctx.lineTo(s*0.82,s*0.52); ctx.lineTo(-s*0.82,s*0.52); ctx.closePath();
      ctx.fillStyle=it.color; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0+wb,-s); ctx.lineTo(0,s*0.52); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0+wb,-s); ctx.lineTo(s*0.42,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0+wb,-s); ctx.lineTo(-s*0.42,0); ctx.stroke();
      ctx.strokeStyle='#bb8800'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.ellipse(0,-s*0.1,s*0.5,s*0.32,0,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#ffcc99';
      ctx.beginPath(); ctx.arc(0,-s*0.12,s*0.28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#5a3a00';
      ctx.beginPath(); ctx.arc(-s*0.1,-s*0.18,1.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.1,-s*0.18,1.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-s*0.06,s*0.1,0,Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  function spawnParticles(x,y,color,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, spd=2+Math.random()*4;
      particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,r:2+Math.random()*3,color,life:40,maxLife:40});
    }
  }

  function showFloat(txt,x,y,color){
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${Math.round(x)}px;top:${Math.round(y)}px;color:${color};font-size:19px;font-weight:700;font-family:Rajdhani,sans-serif;pointer-events:none;z-index:15;transform:translate(-50%,-50%);white-space:nowrap;`;
    d.textContent=txt; gwEl.appendChild(d);
    let t0=null;
    function anim(ts){
      if(!t0) t0=ts;
      const p=(ts-t0)/800;
      d.style.opacity=String(1-p);
      d.style.top=Math.round(y-50*p)+'px';
      if(p<1) requestAnimationFrame(anim); else d.remove();
    }
    requestAnimationFrame(anim);
  }

  // Phase transition flash
  let phaseFlash=0;
  function triggerPhaseFlash(phaseIdx){
    phaseFlash=30;
    const ph=PHASES[phaseIdx];
    showFloat('⚡ '+ph.name+' ⚡', W/2, H/2-20, ph.color);
  }

  function loop(timestamp){
    if(!gameActive){return;}

    // Delta time in seconds, capped to 100ms to avoid huge jumps on tab-switch
    const dt = Math.min((timestamp - (lastTimestamp||timestamp)) / 1000, 0.1);
    lastTimestamp = timestamp;

    ctx.clearRect(0,0,W,H);
    frameCount++;
    waveOff += 36 * dt; // 36px/sec wave scroll

    drawBg();

    // Time tracking
    elapsedSec = (Date.now() - gameStartTime) / 1000;
    if(elapsedSec >= GAME_DURATION){ endGame(); return; }

    // Phase change detection
    const newPhaseIdx = getPhase();
    if(newPhaseIdx !== currentPhaseIdx){
      currentPhaseIdx = newPhaseIdx;
      triggerPhaseFlash(currentPhaseIdx);
    }

    // Spawn accumulator (time-based, not frame-based)
    const ph = PHASES[currentPhaseIdx];
    const spawnInterval = ph.spawnBase; // already in seconds
    spawnAccum += dt;
    if(spawnAccum >= spawnInterval){ spawnAccum = 0; spawnItem(); }

    // Phase flash overlay
    if(phaseFlash>0){
      phaseFlash -= dt * 30;
      ctx.save();
      const alpha = Math.max(0, phaseFlash/30*0.25);
      ctx.fillStyle=PHASES[currentPhaseIdx].color;
      ctx.globalAlpha=alpha;
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
      ctx.restore();
    }

    // Move boat
    boat.x+=(mouseX-boat.x)*(1-Math.pow(0.25,dt*8));
    boat.x=Math.max(boat.w/2+4, Math.min(W-boat.w/2-4, boat.x));
    boat.y=H-boat.h-12;
    drawBoat(boat.x, boat.y);

    // Items — all movement multiplied by dt
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.y += it.vy * dt;
      it.x += it.vx * dt;
      it.rot += it.rotV * dt;
      it.wobble += 3 * dt;
      const hitX=Math.abs(it.x-boat.x)<(boat.w/2+it.size*0.55);
      const hitY=it.y>boat.y-it.size*0.5 && it.y<boat.y+boat.h*0.5;
      if(hitX&&hitY){
        items.splice(i,1);
        if(it.type==='bomb'){
          score = Math.max(0, score - 15);
          combo = 1;
          spawnParticles(it.x,it.y,'#ff4444',16);
          showFloat('💥 -15',it.x,it.y,'#ff6666');
          updateUI();
          phaseFlash = Math.max(phaseFlash, 6);
        } else {
          const pts = it.type==='gold' ? 5 : 2;
          score += pts;
          combo = Math.min(combo+1, 8);
          spawnParticles(it.x,it.y,it.type==='gold'?'#ffdc64':'#44cc66',10);
          showFloat('+'+pts,it.x,it.y,it.type==='gold'?'#ffdc64':'#aaffaa');
          updateUI();
          if(combo>=3){
            const cp=document.getElementById('combo-pop');
            cp.textContent=combo+'× 连击！🔥'; cp.style.opacity='1';
            clearTimeout(cp._t); cp._t=setTimeout(()=>{cp.style.opacity='0';},1100);
          }
        }
        continue;
      }
      if(it.y>H+36){
        items.splice(i,1);
        if(it.type!=='bomb'){combo=1;updateUI();}
        continue;
      }
      drawItem(it);
    }

    // Particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += 9 * dt;
      p.life -= dt * 60;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
      if(p.life<=0)particles.splice(i,1);
    }

    drawTimerArc();
    updatePhaseBar();

    raf=requestAnimationFrame(loop);
  }

  function idleLoop(timestamp){
    if(gameActive) return;
    const dt = Math.min((timestamp - (lastTimestamp||timestamp)) / 1000, 0.1);
    lastTimestamp = timestamp;
    ctx.clearRect(0,0,W,H);
    waveOff += 36 * dt;
    frameCount++;
    drawBg();
    boat.x=W/2; boat.y=H-boat.h-12;
    drawBoat(boat.x,boat.y);
    raf=requestAnimationFrame(idleLoop);
  }

  function startGame(){
    document.getElementById('sc-start').classList.add('hidden');
    document.getElementById('sc-over').classList.add('hidden');
    document.getElementById('ui').classList.remove('hidden');
    document.getElementById('phase-bar').style.display='block';
    document.getElementById('phase-label').style.display='block';
    score=0; combo=1;
    items=[]; particles=[]; frameCount=0; spawnAccum=0; lastTimestamp=0;
    mouseX=W/2; boat.x=W/2;
    currentPhaseIdx=0; phaseFlash=0;
    gameStartTime=Date.now(); elapsedSec=0;
    gameActive=true; running=true;
    updateUI();
    if(raf) cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
  }

  function endGame(){
    gameActive=false; running=false;
    if(raf) cancelAnimationFrame(raf);
    document.getElementById('ui').classList.add('hidden');
    document.getElementById('phase-bar').style.display='none';
    document.getElementById('phase-label').style.display='none';

    const cashValue = score.toFixed(0);
    const won = score > 0;

    document.getElementById('over-emoji').textContent = score>=30?'🏆':score>0?'🎉':'😓';
    document.getElementById('over-title').textContent = score>=30?'恭喜！':'游戏结束';
    document.getElementById('over-stat').textContent = `最终得分：${score} 分`;

    const pb = document.getElementById('prize-box');
    const bc = document.getElementById('btn-claim');
    if(won){
      pb.classList.remove('hidden'); bc.style.display='block';
      document.getElementById('prize-text').textContent = `可兑换现金 $${cashValue} 💰`;
      bc.textContent='立即兑换 →'; bc.disabled=false;
    } else {
      pb.classList.add('hidden'); bc.style.display='none';
    }
    document.getElementById('sc-over').classList.remove('hidden');
    lastTimestamp=0;
    raf=requestAnimationFrame(idleLoop);
  }

  // Mouse / touch
  gwEl.addEventListener('mousemove', e=>{
    const r=gwEl.getBoundingClientRect();
    mouseX=e.clientX-r.left;
  });
  gwEl.addEventListener('touchmove', e=>{
    e.preventDefault();
    const r=gwEl.getBoundingClientRect();
    mouseX=e.touches[0].clientX-r.left;
  },{passive:false});
  gwEl.addEventListener('touchstart', e=>{
    const r=gwEl.getBoundingClientRect();
    mouseX=e.touches[0].clientX-r.left;
  },{passive:true});

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-retry').addEventListener('click', startGame);
  document.getElementById('btn-claim').addEventListener('click', function(){
    this.textContent='✅ 已领取！'; this.disabled=true;
  });

  // Init
  resize();
  initClouds();
  document.getElementById('phase-bar').style.display='none';
  document.getElementById('phase-label').style.display='none';
  raf=requestAnimationFrame(idleLoop);
})();
</script>
