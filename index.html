  * { box-sizing: border-box; margin: 0; padding: 0; }

  #gw {
    background: #0d2c3e;
    min-height: 620px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    font-family: 'Rajdhani', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #sky { position: absolute; top: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg, #0e0826 0%, #2d1b6b 70%, #0d2c3e 100%); }
  #water { position: absolute; top: 110px; left: 0; right: 0; bottom: 0; background: #0b3d55; overflow: hidden; }

  .wline { position: absolute; left: -5%; right: -5%; height: 1px; background: rgba(255,255,255,0.07); }

  /* Lane dividers */
  .lane-div { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.1); border-top: 1px dashed rgba(255,255,255,0.07); }

  /* Finish line */
  #fl { position: absolute; right: 0; top: 110px; width: 8px; height: 350px; background: repeating-linear-gradient(to bottom, #ffcc00 0 10px, #cc0000 10px 20px); z-index: 8; }
  #fl-label { position: absolute; right: 10px; top: 440px; font-size: 10px; color: #ffcc00; font-weight: 700; letter-spacing: 2px; writing-mode: vertical-rl; z-index: 8; }

  /* Boats */
  .boat-wrap { position: absolute; left: 10px; transition: left 0.06s linear; z-index: 15; }
  #boat-p { top: 128px; }
  #boat-e1 { top: 198px; }
  #boat-e2 { top: 268px; }
  #boat-e3 { top: 338px; }

  /* Progress area */
  #prog-area { position: absolute; top: 8px; left: 16px; right: 16px; z-index: 30; }
  #prog-track { background: rgba(255,255,255,0.1); border-radius: 99px; height: 10px; border: 1px solid rgba(255,204,0,0.25); position: relative; }
  #prog-fill { background: linear-gradient(90deg,#ffcc00,#ff6600); height: 100%; border-radius: 99px; width: 0%; transition: width 0.07s; }

  /* HUD */
  #hud { position: absolute; top: 30px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 30; gap: 6px; }
  .hb { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,204,0,0.35); border-radius: 8px; padding: 3px 10px; text-align: center; flex: 1; }
  .hl { font-size: 9px; color: rgba(255,204,0,0.65); letter-spacing: 1px; text-transform: uppercase; }
  .hv { font-size: 20px; font-weight: 700; color: #ffcc00; line-height: 1.1; }

  /* Lane labels */
  .lane-label { position: absolute; left: 8px; font-size: 10px; font-weight: 700; letter-spacing: 1px; z-index: 20; }
  #ll-p { top: 148px; color: #ffcc00; }
  #ll-e1 { top: 218px; color: #ff8888; }
  #ll-e2 { top: 288px; color: #ff6666; }
  #ll-e3 { top: 358px; color: #88ff88; }

  /* Click button */
  #cb {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 30; background: #cc0000; border: none; border-radius: 50%;
    width: 100px; height: 100px; cursor: pointer;
    box-shadow: 0 0 0 6px rgba(255,60,60,0.2), 0 6px 20px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; gap: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  #cb:active { transform: translateX(-50%) scale(0.9); box-shadow: 0 0 0 3px rgba(255,60,60,0.15), 0 2px 8px rgba(0,0,0,0.4); }
  #cb .di { font-size: 28px; line-height: 1; pointer-events: none; }
  #cb .bl { font-size: 12px; opacity: 0.9; pointer-events: none; }

  /* Ripple */
  .rip { position: absolute; border-radius: 50%; border: 2px solid rgba(100,220,255,0.5); animation: ra 0.45s ease-out forwards; pointer-events: none; z-index: 12; }
  @keyframes ra { 0%{width:8px;height:8px;opacity:1;margin:-4px} 100%{width:50px;height:50px;opacity:0;margin:-25px} }

  /* Screens */
  .sc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; background: rgba(8,16,32,0.9); backdrop-filter: blur(3px); padding: 20px; text-align: center; gap: 12px; }
  .sc h1 { font-family: 'Noto Serif SC', serif; font-size: 28px; color: #ffcc00; text-shadow: 0 0 20px #ff6600; }
  .sc p { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.5; max-width: 320px; }
  .sc .sub { font-size: 11px; color: rgba(255,204,0,0.65); letter-spacing: 1px; }
  .sbtn { background: #cc0000; color: #fff; border: none; border-radius: 10px; padding: 12px 36px; font-size: 17px; font-weight: 700; font-family: 'Rajdhani', sans-serif; cursor: pointer; letter-spacing: 1px; box-shadow: 0 4px 16px rgba(200,0,0,0.4); }
  .sbtn2 { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 10px; padding: 8px 24px; font-size: 13px; font-weight: 600; font-family: 'Rajdhani', sans-serif; cursor: pointer; }
  .pbox { background: rgba(255,204,0,0.1); border: 1.5px solid rgba(255,204,0,0.45); border-radius: 12px; padding: 12px 24px; }
  .pbox .pe { font-size: 36px; }
  .pbox .pt { font-size: 18px; font-weight: 700; color: #ffcc00; margin-top: 4px; }
  .hidden { display: none !important; }

  /* Stars */
  #stars { position: absolute; top: 0; left: 0; right: 0; height: 120px; pointer-events: none; z-index: 1; }

  #tap-hint { font-size: 11px; color: rgba(255,204,0,0.45); letter-spacing: 1px; position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 30; }

</style>

const scStart = document.getElementById('sc-start');
const scWin = document.getElementById('sc-win');
const scLose = document.getElementById('sc-lose');

function getWidth() { return document.getElementById('gw').offsetWidth; }

function boatLeft(prog) {
  const w = getWidth();
  const maxL = w - 165;
  return 10 + prog * (maxL - 10);
}

function updateBoatPos(el, prog, baseTop) {
  el.style.left = boatLeft(prog) + 'px';
}

function rafLoop(ts) {
  if (!running) return;
  const dt = lastRaf ? Math.min((ts - lastRaf) / 1000, 0.05) : 0.016;
  lastRaf = ts;

  // Enemies advance automatically — variable speed for drama
  const e1Rate = e1Speed * dt;
  const e2Rate = e2Speed * dt;
  const e3Rate = e3Speed * dt;
  e1Prog = Math.min(e1Prog + e1Rate, 1);
  e2Prog = Math.min(e2Prog + e2Rate, 1);
  e3Prog = Math.min(e3Prog + e3Rate, 1);

  // Slight random jitter for enemies
  e1Speed += (Math.random() - 0.5) * 0.06;
  e2Speed += (Math.random() - 0.5) * 0.06;
  e3Speed += (Math.random() - 0.5) * 0.06;
  e1Speed = Math.max(0.055, Math.min(0.105, e1Speed));
  e2Speed = Math.max(0.050, Math.min(0.100, e2Speed));
  e3Speed = Math.max(0.048, Math.min(0.098, e3Speed));

  updateBoatPos(boatP, pProg);
  updateBoatPos(boatE1, e1Prog);
  updateBoatPos(boatE2, e2Prog);
  updateBoatPos(boatE3, e3Prog);

  // Paddle animation for enemies
  animEnemyPaddle('re1', ts, 400);
  animEnemyPaddle('re2', ts, 420);
  animEnemyPaddle('re3', ts, 440);

  // Place badge
  const standing = [pProg, e1Prog, e2Prog, e3Prog].sort((a,b) => b-a);
  const myRank = standing.indexOf(pProg) + 1;
  placeBadge.textContent = myRank === 1 ? '🥇 领先！' : myRank === 2 ? '🥈 第2名' : myRank === 3 ? '🥉 第3名' : '💀 第4名';
  placeBadge.classList.remove('hidden');

  // Check enemy wins
  if ((e1Prog >= 1 || e2Prog >= 1 || e3Prog >= 1) && !gameOver) {
    endGame(false, 'enemy');
    return;
  }

  rafId = requestAnimationFrame(rafLoop);
}

let lastPaddleToggle = {};
function animEnemyPaddle(id, ts, interval) {
  if (!lastPaddleToggle[id]) lastPaddleToggle[id] = 0;
  if (ts - lastPaddleToggle[id] > interval) {
    lastPaddleToggle[id] = ts;
    const g = document.getElementById(id);
    if (g) { g.style.transform = 'translateY(2px)'; setTimeout(() => { if(g) g.style.transform = ''; }, 80); }
  }
}

function startGame() {
  scStart.classList.add('hidden');
  scWin.classList.add('hidden');
  scLose.classList.add('hidden');
  placeBadge.classList.add('hidden');
  clicks = 0; timeLeft = TOTAL_TIME;
  pProg = 0; e1Prog = 0; e2Prog = 0; e3Prog = 0;
  e1Speed = 0.075; e2Speed = 0.070; e3Speed = 0.072;
  gameOver = false; running = true;
  lastRaf = null; lastPaddleToggle = {};
  updateHUD();
  progFill.style.width = '0%';
  tapHint.style.display = 'block';

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(rafLoop);

  timerInt = setInterval(() => {
    timeLeft--;
    hTimer.textContent = timeLeft;
    hTimer.style.color = timeLeft <= 5 ? '#ff4444' : '#ffcc00';
    if (timeLeft <= 0 && !gameOver) endGame(false, 'time');
  }, 1000);
}

function handleClick(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!running || gameOver) return;

  clicks++;
  pProg = Math.min(clicks / TARGET, 1);
  updateHUD();

  // Ripple
  const gw = document.getElementById('gw');
  const cb = document.getElementById('cb');
  const r = document.createElement('div');
  r.className = 'rip';
  const cbRect = cb.getBoundingClientRect();
  const gwRect = gw.getBoundingClientRect();
  r.style.left = (cbRect.left - gwRect.left + cbRect.width/2) + 'px';
  r.style.top = (cbRect.top - gwRect.top + cbRect.height/2) + 'px';
  gw.appendChild(r);
  setTimeout(() => r.remove(), 500);

  // Player paddle anim
  const rp = document.getElementById('rp');
  if (rp) { rp.style.transform = 'translateY(2px)'; setTimeout(() => { if(rp) rp.style.transform = ''; }, 80); }

  if (pProg >= 1 && !gameOver) endGame(true);
}

function updateHUD() {
  hClicks.textContent = clicks;
  hNeed.textContent = Math.max(TARGET - clicks, 0);
  progFill.style.width = (pProg * 100) + '%';
}

function endGame(win, reason) {
  gameOver = true; running = false;
  clearInterval(timerInt); timerInt = null;
  cancelAnimationFrame(rafId);
  tapHint.style.display = 'none';

  if (win) {
    const prizes = ['免费抽奖一次！🎰','积分 +500 🏆','神秘红包 🧧','下注积分翻倍券 ×1 💎'];
    document.getElementById('prize-text').textContent = prizes[Math.floor(Math.random()*prizes.length)];
    document.getElementById('win-stat').textContent = `用时 ${TOTAL_TIME - timeLeft} 秒 · 共点击 ${clicks} 次 🔥`;
    document.getElementById('btn-claim').textContent = '领取奖励 →';
    document.getElementById('btn-claim').disabled = false;
    scWin.classList.remove('hidden');
  } else {
    const e1pct = Math.round(e1Prog * 100);
    const e2pct = Math.round(e2Prog * 100);
    const e3pct = Math.round(e3Prog * 100);
    const mypct = Math.round(pProg * 100);
    let msg = reason === 'time'
      ? `时间到！你完成了 ${mypct}%，红队 ${e1pct}%，橙队 ${e2pct}%，绿队 ${e3pct}%`
      : `被对手抢先！再快一点点！`;
    document.getElementById('lose-stat').textContent = msg;
    scLose.classList.remove('hidden');
  }
}

function resetGame() {
  scWin.classList.add('hidden');
  scLose.classList.add('hidden');
  placeBadge.classList.add('hidden');
  hTimer.style.color = '#ffcc00';
  boatP.style.left = '10px';
  boatE1.style.left = '10px';
  boatE2.style.left = '10px';
  boatE3.style.left = '10px';
  progFill.style.width = '0%';
  hClicks.textContent = '0'; hTimer.textContent = TOTAL_TIME; hNeed.textContent = TARGET;
  scStart.classList.remove('hidden');
}

// Button events — both mouse and touch
const cb = document.getElementById('cb');
cb.addEventListener('mousedown', handleClick);
cb.addEventListener('touchstart', handleClick, { passive: false });

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-win-retry').addEventListener('click', resetGame);
document.getElementById('btn-lose-retry').addEventListener('click', resetGame);
document.getElementById('btn-claim').addEventListener('click', function() {
  this.textContent = '✅ 已领取！'; this.disabled = true;
});

// Wave idle animation
(function waveAnim() {
  const lines = document.querySelectorAll('.wline');
  lines.forEach((l,i) => { l.style.transform = `translateX(${Math.sin(Date.now()/900+i)*5}px)`; });
  requestAnimationFrame(waveAnim);
})();

// Idle boat bob
(function idleBob() {
  if (!running) {
    const bob = Math.sin(Date.now()/600)*2;
    boatP.style.top = (128 + bob) + 'px';
    boatE1.style.top = (198 + Math.sin(Date.now()/700+1)*2) + 'px';
    boatE2.style.top = (268 + Math.sin(Date.now()/800+2)*2) + 'px';
    boatE3.style.top = (338 + Math.sin(Date.now()/750+3)*2) + 'px';
  }
  requestAnimationFrame(idleBob);
})();
</script>
